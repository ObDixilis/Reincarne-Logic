<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Network connection illustration</title>
  <desc id="heroDesc">Abstract diagram showing connected nodes between insight, automation, and safeguards</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="480" height="360" rx="28" fill="url(#bg)" />
  <g stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7">
    <path d="M120 105C160 40 320 40 360 105" fill="none" />
    <path d="M120 255c40 65 200 65 240 0" fill="none" />
    <path d="M80 180h320" stroke-dasharray="12 10" />
    <path d="M160 135l160 90" stroke-dasharray="14 12" />
    <path d="M160 225l160-90" stroke-dasharray="14 12" />
  </g>
  <g fill="#f8fafc" fill-opacity="0.95">
    <circle cx="120" cy="105" r="18" />
    <circle cx="360" cy="105" r="18" />
    <circle cx="120" cy="255" r="18" />
    <circle cx="360" cy="255" r="18" />
    <circle cx="80" cy="180" r="14" />
    <circle cx="400" cy="180" r="14" />
  </g>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="240" cy="180" r="50" fill="#0ea5e9" />
    <circle cx="240" cy="180" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="240" cy="180" r="6" fill="#22c55e" />
    <path
      d="M240 140c18 0 32 14 32 32s-14 32-32 32-32-14-32-32 14-32 32-32z"
      fill="none"
      stroke="#38bdf8"
      stroke-width="2"
      stroke-dasharray="6 6"
    />
  </g>
  <g font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle" font-size="12" fill="#0ea5e9">
    <text x="120" y="107">INSIGHT</text>
    <text x="360" y="107">IDEATE</text>
    <text x="120" y="257">AUTOMATE</text>
    <text x="360" y="257">GUARD</text>
    <text x="80" y="182">TEAM</text>
    <text x="400" y="182">USER</text>
  </g>
</svg>
